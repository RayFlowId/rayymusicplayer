<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>RAY MUSIC V3</title>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#08090d;
 --card:#11141b;
 --card2:#171a22;
 --line:rgba(255,255,255,.08);
 --text:#fff;
 --muted:#9ca3af;
 --blue:#00c4ff;
 --green:#1ed760;
}

body{
 background:
 radial-gradient(circle at 10% 0%,rgba(0,196,255,.14),transparent 30%),
 radial-gradient(circle at 90% 20%,rgba(0,119,255,.1),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 min-height:100vh;
 padding-bottom:110px;
}

button,input{font:inherit}
button{cursor:pointer;border:0}
img{display:block}

header{
 height:70px;
 position:sticky;
 top:0;
 z-index:50;
 display:flex;
 align-items:center;
 gap:20px;
 padding:0 25px;
 background:rgba(8,9,13,.85);
 backdrop-filter:blur(20px);
 border-bottom:1px solid var(--line);
}

.logo{
 font-size:23px;
 font-weight:900;
 white-space:nowrap;
}

.logo span{color:var(--blue)}

.search{
 flex:1;
 max-width:650px;
 margin:auto;
 position:relative;
}

.search input{
 width:100%;
 height:44px;
 border-radius:24px;
 border:1px solid var(--line);
 outline:none;
 background:#151820;
 color:white;
 padding:0 45px 0 18px;
}

.search input:focus{
 border-color:var(--blue);
 box-shadow:0 0 0 4px rgba(0,196,255,.08);
}

.search-icon{
 position:absolute;
 right:16px;
 top:12px;
 color:#777;
}

.spotify-btn{
 background:#151820;
 color:white;
 border:1px solid var(--line);
 padding:11px 15px;
 border-radius:12px;
}

.spotify-btn:hover{
 border-color:var(--blue);
}

main{
 max-width:1250px;
 margin:auto;
 padding:30px 22px;
}

.hero{
 min-height:280px;
 padding:40px;
 border-radius:25px;
 border:1px solid var(--line);
 background:
 linear-gradient(120deg,rgba(0,196,255,.12),rgba(0,0,0,.05)),
 #10131a;
 display:flex;
 align-items:center;
 position:relative;
 overflow:hidden;
}

.hero:after{
 content:"";
 position:absolute;
 width:400px;
 height:400px;
 right:-180px;
 top:-170px;
 border-radius:50%;
 background:rgba(0,196,255,.12);
 filter:blur(30px);
}

.hero-content{
 position:relative;
 z-index:2;
}

.hero h1{
 font-size:clamp(40px,7vw,70px);
 letter-spacing:-4px;
}

.hero h1 span{color:var(--blue)}

.hero p{
 max-width:650px;
 color:var(--muted);
 line-height:1.6;
 margin-top:12px;
}

.actions{
 display:flex;
 gap:10px;
 margin-top:25px;
 flex-wrap:wrap;
}

.primary{
 background:var(--blue);
 color:#001018;
 padding:13px 18px;
 border-radius:13px;
 font-weight:800;
}

.secondary{
 background:#191d26;
 color:white;
 padding:13px 18px;
 border-radius:13px;
 border:1px solid var(--line);
}

.status{
 margin-top:18px;
 padding:13px 16px;
 background:#10131a;
 border:1px solid var(--line);
 border-radius:15px;
 color:var(--muted);
}

.dot{
 width:8px;
 height:8px;
 border-radius:50%;
 display:inline-block;
 background:#555;
 margin-right:8px;
}

.dot.on{
 background:var(--green);
 box-shadow:0 0 10px var(--green);
}

.section{margin-top:32px}

.section-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:17px;
}

.section-head h2{font-size:22px}

.section-head span{
 color:var(--muted);
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:17px;
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:17px;
 overflow:hidden;
 transition:.2s;
}

.card:hover{
 transform:translateY(-4px);
 border-color:rgba(0,196,255,.35);
}

.cover{
 position:relative;
 aspect-ratio:1;
 background:#191c24;
}

.cover img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.play{
 position:absolute;
 right:12px;
 bottom:12px;
 width:45px;
 height:45px;
 border-radius:50%;
 background:var(--blue);
 color:#001018;
 font-size:18px;
 box-shadow:0 7px 25px rgba(0,0,0,.5);
}

.info{
 padding:13px;
}

.info h3{
 font-size:15px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.info p{
 color:var(--muted);
 font-size:13px;
 margin-top:6px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.info small{
 display:block;
 color:#666e7a;
 margin-top:5px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.empty{
 grid-column:1/-1;
 padding:45px;
 text-align:center;
 border:1px dashed var(--line);
 border-radius:18px;
 color:var(--muted);
}

.player{
 position:fixed;
 z-index:100;
 left:12px;
 right:12px;
 bottom:12px;
 height:78px;
 padding:10px 15px;
 border:1px solid rgba(255,255,255,.1);
 border-radius:20px;
 background:rgba(16,18,25,.94);
 backdrop-filter:blur(25px);
 display:grid;
 grid-template-columns:1fr 1.3fr 1fr;
 align-items:center;
 gap:15px;
 box-shadow:0 15px 50px rgba(0,0,0,.45);
}

.now{
 min-width:0;
 display:flex;
 align-items:center;
 gap:12px;
}

.now img{
 width:53px;
 height:53px;
 border-radius:10px;
 object-fit:cover;
 background:#222;
}

.now-info{
 min-width:0;
}

.now-info b,
.now-info span{
 display:block;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}

.now-info span{
 color:var(--muted);
 font-size:12px;
 margin-top:5px;
}

.controls{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:10px;
}

.control{
 width:38px;
 height:38px;
 border-radius:50%;
 background:transparent;
 color:white;
}

.control:hover{background:#242833}

.control.main{
 width:45px;
 height:45px;
 background:white;
 color:#08090d;
 font-size:18px;
}

.right{
 display:flex;
 justify-content:flex-end;
 align-items:center;
 gap:10px;
 color:var(--muted);
 font-size:12px;
}

.volume{
 width:100px;
 accent-color:var(--blue);
}

.progress{
 position:absolute;
 left:18px;
 right:18px;
 bottom:-3px;
 width:calc(100% - 36px);
 accent-color:var(--blue);
}

.toast{
 position:fixed;
 z-index:200;
 right:20px;
 top:88px;
 padding:13px 16px;
 border-radius:13px;
 background:#171a22;
 border:1px solid var(--line);
 transform:translateX(140%);
 transition:.25s;
}

.toast.show{transform:translateX(0)}

@media(max-width:950px){
 .grid{grid-template-columns:repeat(4,1fr)}
 .player{grid-template-columns:1fr auto}
 .right{display:none}
}

@media(max-width:700px){
 header{
  padding:0 14px;
  gap:10px;
 }

 .logo{font-size:19px}

 .spotify-btn{
  padding:9px 10px;
  font-size:12px;
 }

 .search{
  position:absolute;
  top:78px;
  left:14px;
  right:14px;
  max-width:none;
 }

 header{margin-bottom:58px}

 main{padding:20px 14px}

 .hero{
  padding:25px;
  min-height:300px;
 }

 .grid{
  grid-template-columns:repeat(2,1fr);
  gap:12px;
 }

 .player{
  left:6px;
  right:6px;
  bottom:6px;
  height:70px;
  padding:8px;
 }

 .now img{
  width:48px;
  height:48px;
 }

 .controls{gap:3px}

 .control{
  width:34px;
  height:34px;
 }

 .control.main{
  width:42px;
  height:42px;
 }

 .control.skip{display:none}
}

@media(max-width:420px){
 .hero h1{letter-spacing:-2px}
 .actions button{width:100%}
}
</style>
</head>

<body>

<header>

 <div class="logo">
  RAY <span>MUSIC</span>
 </div>

 <div class="search">
  <input
   id="search"
   type="search"
   placeholder="Cari lagu, artis, album..."
   autocomplete="off"
  >
  <span class="search-icon">⌕</span>
 </div>

 <button
  class="spotify-btn"
  onclick="spotifyLogin()"
 >
  🎧 Spotify
 </button>

</header>

<main>

 <section class="hero">

  <div class="hero-content">

   <h1>
    RAY <span>MUSIC</span>
   </h1>

   <p>
    Cari lagu favoritmu melalui Spotify dan
    gunakan RAY MUSIC sebagai player Spotify
    langsung dari browser.
   </p>

   <div class="actions">

    <button
     class="primary"
     onclick="spotifyLogin()"
    >
     Hubungkan Spotify
    </button>

    <button
     class="secondary"
     onclick="document.getElementById('search').focus()"
    >
     🔎 Cari Musik
    </button>

   </div>

  </div>

 </section>

 <div class="status">

  <span
   id="statusDot"
   class="dot"
  ></span>

  <b id="status">
   Spotify belum terhubung
  </b>

 </div>

 <section class="section">

  <div class="section-head">

   <h2>Hasil Pencarian</h2>

   <span id="count"></span>

  </div>

  <div
   id="results"
   class="grid"
  >

   <div class="empty">

    🎵
    <br><br>

    Hubungkan Spotify lalu
    cari lagu yang kamu mau.

   </div>

  </div>

 </section>

</main>

<div class="player">

 <div class="now">

  <img
   id="nowCover"
   src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=300&q=80"
  >

  <div class="now-info">

   <b id="nowTitle">
    Belum ada lagu
   </b>

   <span id="nowArtist">
    RAY MUSIC
   </span>

  </div>

 </div>

 <div class="controls">

  <button
   class="control skip"
   onclick="previous()"
  >
   ⏮
  </button>

  <button
   id="play"
   class="control main"
   onclick="togglePlay()"
  >
   ▶
  </button>

  <button
   class="control skip"
   onclick="next()"
  >
   ⏭
  </button>

 </div>

 <div class="right">

  <span id="time">
   0:00 / 0:00
  </span>

  <input
   id="volume"
   class="volume"
   type="range"
   min="0"
   max="1"
   step=".01"
   value=".8"
  >

 </div>

 <input
  id="progress"
  class="progress"
  type="range"
  min="0"
  max="100"
  value="0"
 >

</div>

<div
 id="toast"
 class="toast"
></div>

<script>

/* =====================================================
   RAY MUSIC V3
   SPOTIFY CONFIG
===================================================== */

/*
   MASUKKAN CLIENT ID KAMU DI SINI.

   JANGAN masukkan Client Secret.
   Website GitHub Pages menggunakan PKCE.
*/

const CLIENT_ID =
 "MASUKKAN_CLIENT_ID_KAMU_DISINI";


/*
   Karena website kamu:
   https://music.rayyy.my.id/

   redirect URI otomatis mengikuti halaman ini.
*/

const REDIRECT_URI =
 window.location.origin +
 window.location.pathname;


const SCOPES =
 "streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state";


let token =
 sessionStorage.getItem(
  "ray_spotify_token"
 ) || "";


let player = null;

let deviceId = null;

let currentTrack = null;

let searchTimer = null;


/* =====================================================
   TOAST
===================================================== */

function toast(message){

 const el =
  document.getElementById("toast");

 el.textContent = message;

 el.classList.add("show");

 clearTimeout(
  window.__toast
 );

 window.__toast =
  setTimeout(
   ()=>{
    el.classList.remove("show");
   },
   3000
  );
}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

 return String(value || "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =====================================================
   RANDOM PKCE
===================================================== */

function randomString(length=64){

 const chars =
 "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

 const array =
 new Uint8Array(length);

 crypto.getRandomValues(array);

 return Array
  .from(array)
  .map(
   n => chars[n % chars.length]
  )
  .join("");

}


async function sha256(text){

 return crypto.subtle.digest(
  "SHA-256",
  new TextEncoder().encode(text)
 );

}


function base64url(buffer){

 return btoa(
  String.fromCharCode(
   ...new Uint8Array(buffer)
  )
 )
 .replace(/\+/g,"-")
 .replace(/\//g,"_")
 .replace(/=/g,"");

}


/* =====================================================
   LOGIN
===================================================== */

async function spotifyLogin(){

 if(
  !CLIENT_ID ||
  CLIENT_ID ===
  "297fd142b7a44fcfb3711a0251bb5fd6"
 ){

  toast(
   "Masukkan Client ID dulu di kode."
  );

  return;
 }


 const verifier =
  randomString(64);


 const challenge =
  base64url(
   await sha256(verifier)
  );


 const state =
  randomString(32);


 sessionStorage.setItem(
  "ray_pkce_verifier",
  verifier
 );


 sessionStorage.setItem(
  "ray_spotify_state",
  state
 );


 const params =
  new URLSearchParams({

   response_type:"code",

   client_id:CLIENT_ID,

   scope:SCOPES,

   redirect_uri:REDIRECT_URI,

   state:state,

   code_challenge_method:"S256",

   code_challenge:challenge

  });


 window.location.href =
  "https://accounts.spotify.com/authorize?" +
  params.toString();

}


/* =====================================================
   CALLBACK
===================================================== */

async function callback(){

 const params =
  new URLSearchParams(
   window.location.search
  );


 const code =
  params.get("code");


 const error =
  params.get("error");


 if(error){

  toast(
   "Login Spotify dibatalkan."
  );

  cleanURL();

  return;

 }


 if(!code)
  return;


 const state =
  params.get("state");


 const savedState =
  sessionStorage.getItem(
   "ray_spotify_state"
  );


 if(
  !state ||
  state !== savedState
 ){

  toast(
   "State Spotify tidak cocok."
  );

  cleanURL();

  return;

 }


 const verifier =
  sessionStorage.getItem(
   "ray_pkce_verifier"
  );


 try{

  const response =
   await fetch(
    "https://accounts.spotify.com/api/token",
    {

     method:"POST",

     headers:{
      "Content-Type":
       "application/x-www-form-urlencoded"
     },

     body:
      new URLSearchParams({

       grant_type:
        "authorization_code",

       code:
        code,

       redirect_uri:
        REDIRECT_URI,

       client_id:
        CLIENT_ID,

       code_verifier:
        verifier

      })

    }
   );


  const data =
   await response.json();


  if(!response.ok){

   throw new Error(
    data.error_description ||
    "Token gagal."
   );

  }


  token =
   data.access_token;


  sessionStorage.setItem(
   "ray_spotify_token",
   token
  );


  cleanURL();


  setStatus(
   true,
   "Spotify terhubung"
  );


  toast(
   "Spotify berhasil terhubung!"
  );


  initPlayer();


 }catch(error){

  console.error(error);

  toast(
   "Gagal login Spotify."
  );

 }

}


function cleanURL(){

 history.replaceState(
  {},
  document.title,
  REDIRECT_URI
 );

}


/* =====================================================
   API
===================================================== */

async function spotifyAPI(
 endpoint,
 options={}
){

 if(!token)
  throw new Error(
   "Belum login."
  );


 const response =
  await fetch(
   "https://api.spotify.com/v1" +
   endpoint,
   {

    ...options,

    headers:{
     ...(options.headers || {}),

     Authorization:
      "Bearer " + token
    }

   }
  );


 if(
  response.status === 401
 ){

  token = "";

  sessionStorage.removeItem(
   "ray_spotify_token"
  );

  setStatus(
   false,
   "Sesi Spotify berakhir"
  );

  throw new Error(
   "Unauthorized"
  );

 }


 if(!response.ok){

  throw new Error(
   await response.text()
  );

 }


 return response.json();

}


/* =====================================================
   SEARCH
===================================================== */

document
 .getElementById("search")
 .addEventListener(
  "input",
  function(){

   const query =
    this.value.trim();

   clearTimeout(
    searchTimer
   );


   if(!query){

    document
     .getElementById("results")
     .innerHTML = `
      <div class="empty">
       🎵<br><br>
       Cari lagu atau artis.
      </div>
     `;

    document
     .getElementById("count")
     .textContent = "";

    return;

   }


   searchTimer =
    setTimeout(
     ()=>search(query),
     500
    );

  }
 );


async function search(query){

 if(!token){

  toast(
   "Hubungkan Spotify dulu."
  );

  spotifyLogin();

  return;

 }


 const results =
  document.getElementById(
   "results"
  );


 results.innerHTML = `
  <div class="empty">
   🔎 Mencari ${escapeHTML(query)}...
  </div>
 `;


 try{

  const data =
   await spotifyAPI(
    "/search?" +
    new URLSearchParams({

     q:query,

     type:"track",

     limit:"20"

    })
   );


  render(
   data.tracks?.items || []
  );


 }catch(error){

  console.error(error);

  results.innerHTML = `
   <div class="empty">
    ❌ Pencarian gagal.
   </div>
  `;

 }

}


/* =====================================================
   RENDER
===================================================== */

function render(tracks){

 const results =
  document.getElementById(
   "results"
  );


 document
  .getElementById("count")
  .textContent =
   tracks.length + " lagu";


 if(!tracks.length){

  results.innerHTML = `
   <div class="empty">
    Lagu tidak ditemukan.
   </div>
  `;

  return;

 }


 results.innerHTML =
  tracks
   .map(
    track => {

     const cover =
      track.album?.images?.[0]?.url ||
      "https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=700&q=80";


     const artists =
      track.artists
       .map(
        artist => artist.name
       )
       .join(", ");


     return `

      <article class="card">

       <div class="cover">

        <img
         src="${escapeHTML(cover)}"
         alt=""
         loading="lazy"
        >

        <button
         class="play"
         onclick="playTrack('${track.id}')"
        >
         ▶
        </button>

       </div>

       <div class="info">

        <h3>
         ${escapeHTML(track.name)}
        </h3>

        <p>
         ${escapeHTML(artists)}
        </p>

        <small>
         ${escapeHTML(
          track.album?.name
         )}
        </small>

       </div>

      </article>

     `;

    }
   )
   .join("");

}


/* =====================================================
   PLAY
===================================================== */

async function playTrack(id){

 if(!token){

  spotifyLogin();

  return;

 }


 if(!deviceId){

  toast(
   "Spotify Player belum siap."
  );

  return;

 }


 try{

  await spotifyAPI(
   "/me/player/play?device_id=" +
   encodeURIComponent(deviceId),
   {

    method:"PUT",

    headers:{
     "Content-Type":
      "application/json"
    },

    body:
     JSON.stringify({

      uris:[
       "spotify:track:" + id
      ]

     })

   }
  );


  toast(
   "▶ Memutar lagu"
  );


 }catch(error){

  console.error(error);

  toast(
   "Spotify tidak bisa memutar lagu."
  );

 }

}


/* =====================================================
   PLAYER
===================================================== */

function initPlayer(){

 if(
  !token ||
  player
 )
  return;


 if(!window.Spotify){

  setTimeout(
   initPlayer,
   500
  );

  return;

 }


 player =
  new Spotify.Player({

   name:
    "RAY MUSIC V3",

   volume:
    .8,

   getOAuthToken:
    callback => {

     callback(
      token
     );

    }

  });


 player.addListener(
  "ready",
  ({device_id}) => {

   deviceId =
    device_id;

   setStatus(
    true,
    "RAY MUSIC Player siap"
   );

   toast(
    "Player Spotify siap!"
   );

  }
 );


 player.addListener(
  "not_ready",
  ({device_id}) => {

   if(
    device_id ===
    deviceId
   ){

    deviceId = null;

   }

  }
 );


 player.addListener(
  "initialization_error",
  ({message}) => {

   console.error(message);

   toast(
    "Spotify Player gagal diinisialisasi."
   );

  }
 );


 player.addListener(
  "authentication_error",
  ({message}) => {

   console.error(message);

   toast(
    "Autentikasi Spotify gagal."
   );

  }
 );


 player.addListener(
  "account_error",
  ({message}) => {

   console.error(message);

   toast(
    "Playback membutuhkan Spotify Premium."
   );

  }
 );


 player.addListener(
  "playback_error",
  ({message}) => {

   console.error(message);

   toast(
    "Playback Spotify gagal."
   );

  }
 );


 player.addListener(
  "player_state_changed",
  state => {

   if(!state)
    return;


   const track =
    state.track_window
     ?.current_track;


   if(track){

    currentTrack =
     track;

    document
     .getElementById(
      "nowTitle"
     )
     .textContent =
      track.name;


    document
     .getElementById(
      "nowArtist"
     )
     .textContent =
      track.artists
       .map(
        a => a.name
       )
       .join(", ");


    const image =
     track.album
      ?.images
      ?.[0]
      ?.url;


    if(image){

     document
      .getElementById(
       "nowCover"
      )
      .src =
       image;

    }

   }


   document
    .getElementById(
     "play"
    )
    .textContent =
     state.paused
      ? "▶"
      : "⏸";


   document
    .getElementById(
     "progress"
    )
    .value =
     state.duration
      ? (
       state.position /
       state.duration
      ) * 100
      : 0;


   document
    .getElementById(
     "time"
    )
    .textContent =
     formatTime(
      state.position
     ) +
     " / " +
     formatTime(
      state.duration
     );

  }
 );


 player.connect();

}


/* =====================================================
   CONTROLS
===================================================== */

async function togglePlay(){

 if(!player){

  spotifyLogin();

  return;

 }

 await player.togglePlay();

}


async function next(){

 if(player)
  await player.nextTrack();

}


async function previous(){

 if(player)
  await player.previousTrack();

}


/* =====================================================
   VOLUME
===================================================== */

document
 .getElementById("volume")
 .addEventListener(
  "input",
  function(){

   if(player){

    player.setVolume(
     Number(this.value)
    );

   }

  }
 );


/* =====================================================
   PROGRESS
===================================================== */

document
 .getElementById("progress")
 .addEventListener(
  "change",
  async function(){

   if(!player)
    return;


   const state =
    await player.getCurrentState();


   if(!state)
    return;


   const position =
    state.duration *
    (Number(this.value) / 100);


   await player.seekTo(
    position
   );

  }
 );


/* =====================================================
   STATUS
===================================================== */

function setStatus(
 connected,
 text
){

 document
  .getElementById(
   "statusDot"
  )
  .classList.toggle(
   "on",
   connected
  );


 document
  .getElementById(
   "status"
  )
  .textContent =
   text;

}


/* =====================================================
   SDK READY
===================================================== */

window.onSpotifyWebPlaybackSDKReady =
 function(){

  if(token)
   initPlayer();

 };


/* =====================================================
   START
===================================================== */

(async function(){

 await callback();

 if(token){

  setStatus(
   true,
   "Menghubungkan Spotify..."
  );

  initPlayer();

 }

})();

</script>
